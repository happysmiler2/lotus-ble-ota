
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus BLE OTA Uploader</title>
<style>
body {
  background:#101820;
  color:#e9f0f7;
  font:16px -apple-system,Arial,sans-serif;
  padding:18px;
}
h2 {color:#80c9ff}
button {
  background:#244665;
  color:white;
  border:1px solid #658aaa;
  border-radius:8px;
  padding:13px;
  margin:5px;
  font-size:16px;
}
button:disabled {opacity:.4}
input[type=file] {max-width:100%}
progress {width:100%;height:24px}
pre {
  background:#070d13;
  padding:14px;
  border-radius:8px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}
</style>
</head>
<body>

<h2>Lotus BLE OTA Uploader</h2>
<p>
RED: Diagnostic_Tester_ESP32C3.ino<br>
Firmware: V1.56-ROAD<br>
Packet size: 128 bytes
</p>

<button id="connect" onclick="connectRED()">
1. Connect RED
</button>

<p>2. Select ESP32 application firmware:</p>
<input id="file" type="file" accept=".bin"
       onchange="updateButtons()">

<p>
<label>
<input id="confirm" type="checkbox"
       onchange="updateButtons()">
RED is on the bench, engine off, GPIO1 grounded
before boot, and USB recovery is available.
BLUE simulates zero RPM and speed.
</label>
</p>

<button id="flash" disabled onclick="flashFirmware()">
3. Flash Complete Firmware
</button>

<button id="abort" onclick="requestAbort()">
ABORT
</button>

<h3>Transfer progress</h3>
<progress id="progress" value="0" max="100"></progress>
<div id="counter">0%</div>

<h3>Activity Log</h3>
<pre id="log">Ready.</pre>

<script>
const SERVICE="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CTRL="6e400008-b5a3-f393-e0a9-e50e24dcca9e";
const DATA="6e400009-b5a3-f393-e0a9-e50e24dcca9e";
const REPLY="6e40000a-b5a3-f393-e0a9-e50e24dcca9e";

const enc=new TextEncoder();
const dec=new TextDecoder();
const CHUNK=128;

let device,ctrl,data,reply;
let busy=false;
let stop=false;
let sessionActive=false;
let messages=[];
let disconnected=false;

function log(s) {
  const el=document.getElementById("log");
  el.textContent+="\n"+
    new Date().toLocaleTimeString()+" "+s;
}

function describeError(e) {
  return JSON.stringify({
    name:e?.name,
    message:e?.message,
    code:e?.code,
    text:String(e)
  });
}

function updateButtons() {
  document.getElementById("flash").disabled=
    busy ||
    !device?.gatt?.connected ||
    !document.getElementById("file").files.length ||
    !document.getElementById("confirm").checked;

  document.getElementById("connect").disabled=busy;
}

async function cmd(s) {
  log("CTRL > "+s);
  await ctrl.writeValueWithResponse(enc.encode(s));
}

async function connectRED() {
  try {
    if(busy)return;

    device=await navigator.bluetooth.requestDevice({
      filters:[{name:"OBD2-CAN"}],
      optionalServices:[SERVICE]
    });

    device.addEventListener("gattserverdisconnected",()=>{
      disconnected=true;
      stop=true;
      log("RED disconnected");
      updateButtons();
    });

    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);

    ctrl=await service.getCharacteristic(CTRL);
    data=await service.getCharacteristic(DATA);
    reply=await service.getCharacteristic(REPLY);

    await reply.startNotifications();

    reply.addEventListener(
      "characteristicvaluechanged",e=>{
        const s=dec.decode(e.target.value);
        messages.push(s);
        log("RED: "+s);

        if(s.startsWith("OTA,ERR") ||
           s==="OTA,ABORTED") {
          stop=true;
        }
      }
    );

    disconnected=false;
    log("Connected to RED");
    await cmd("INFO");
    updateButtons();

  } catch(e) {
    log("CONNECT ERROR: "+describeError(e));
  }
}

async function waitFor(prefix,after,timeout=8000) {
  const deadline=Date.now()+timeout;

  while(Date.now()<deadline) {
    if(disconnected)
      throw new Error("BLE disconnected");

    const found=messages.slice(after).find(s=>
      s.startsWith(prefix) ||
      s.startsWith("OTA,ERR") ||
      s==="OTA,ABORTED"
    );

    if(found)return found;

    await new Promise(r=>setTimeout(r,50));
  }

  throw new Error("Timeout waiting for "+prefix);
}

function requestAbort() {
  stop=true;
  log("Abort requested");

  if(!busy) {
    abortSession();
  }
}

async function abortSession() {
  if(!ctrl || !device?.gatt?.connected)
    return;

  try {
    await cmd("ABORT");
    log("ABORT sent");
  } catch(e) {
    log("ABORT ERROR: "+describeError(e));
  }
}

async function flashFirmware() {
  if(busy)return;

  busy=true;
  stop=false;
  sessionActive=false;
  updateButtons();

  let sent=0;
  let completed=false;
  const start=Date.now();

  try {
    const file=document.getElementById("file").files[0];
    if(!file)
      throw new Error("Select a firmware file");

    const bytes=new Uint8Array(await file.arrayBuffer());

    if(bytes.length<4096 || bytes[0]!==0xE9)
      throw new Error("Invalid ESP32 application binary");

    if(!data.properties.write)
      throw new Error("DATA write not supported");

    log("Firmware: "+file.name);
    log("Size: "+bytes.length+" bytes");
    log("Packet size: "+CHUNK);

    let index=messages.length;
    await cmd("INFO");

    let response=await waitFor("OTA,ARMED",index);

    if(response!=="OTA,ARMED")
      throw new Error("RED not armed: "+response);

    if(stop)
      throw new Error("Aborted before BEGIN");

    // Mark session as potentially active before BEGIN.
    // This ensures cleanup even if its reply is lost.
    sessionActive=true;
    index=messages.length;
    await cmd("BEGIN,"+bytes.length);

    response=await waitFor("OTA,READY",index);

    if(response!=="OTA,READY")
      throw new Error("BEGIN failed: "+response);

    log("RED ready — starting firmware transfer");

    const transferIndex=messages.length;
    let lastLoggedPercent=-1;

    while(sent<bytes.length) {
      if(stop)
        throw new Error("Transfer stopped");

      const end=Math.min(sent+CHUNK,bytes.length);
      const part=bytes.slice(sent,end);

      await data.writeValueWithResponse(part);
      sent=end;

      const percent=Math.floor(
        sent*100/bytes.length
      );

      document.getElementById("progress").value=
        sent*100/bytes.length;

      document.getElementById("counter").textContent=
        sent+" / "+bytes.length+
        " bytes ("+percent+"%)";

      if(percent>=lastLoggedPercent+5) {
        log("BLE transfer: "+percent+"%");
        lastLoggedPercent=percent;
      }

      // Detect errors reported by RED during transfer.
      const failure=messages.slice(transferIndex).find(
        s=>s.startsWith("OTA,ERR") ||
           s==="OTA,ABORTED"
      );

      if(failure)
        throw new Error("RED reported: "+failure);
    }

    if(stop)
      throw new Error("Transfer stopped");

    log("All firmware bytes sent.");
    log("Waiting for RED final progress confirmation...");

    index=transferIndex;
    const finalStatus=
      "OTA,PROGRESS,"+bytes.length+","+bytes.length;

    response=await waitFor(finalStatus,index,15000);

    if(response!==finalStatus)
      throw new Error(
        "Final flash confirmation failed: "+response
      );

    if(stop)
      throw new Error("Transfer stopped before END");

    log("RED confirmed all firmware bytes written.");

    // END triggers firmware validation and boot selection.
    // Never send END before full transfer confirmation.
    index=messages.length;
    await cmd("END");

    response=await waitFor("OTA,DONE",index,15000);

    if(response!=="OTA,DONE")
      throw new Error("Firmware validation failed: "+response);

    completed=true;
    sessionActive=false;

    log("SUCCESS: RED reported OTA,DONE");
    log("RED should restart automatically.");
    log("Verify firmware version and operation after reboot.");

  } catch(e) {
    log("OTA ERROR: "+describeError(e));
  } finally {
    if(!completed && sessionActive) {
      log("Aborting incomplete OTA session");
      await abortSession();
    }

    const elapsed=(Date.now()-start)/1000;
    log("Elapsed: "+elapsed.toFixed(1)+" seconds");

    if(!completed)
      log("Update not completed — no successful END confirmation");

    busy=false;
    sessionActive=false;
    updateButtons();
  }
}
</script>
</body>
</html>
