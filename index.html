
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus BLE DATA Diagnostic</title>
<style>
body {
  background:#0d131c;
  color:#e6edf6;
  font:16px -apple-system,Arial,sans-serif;
  padding:20px;
}
button {
  background:#20364e;
  color:white;
  border:1px solid #537293;
  border-radius:9px;
  padding:14px;
  margin:5px;
}
pre {
  background:#080d14;
  padding:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>
<h2>Lotus BLE DATA Diagnostic</h2>
<p>BENCH ONLY — read-only inspection.
No firmware writes.</p>

<button onclick="connect()">Connect RED</button>
<button onclick="inspect()">Inspect DATA</button>
<button onclick="disconnect()">Disconnect</button>

<h3>Activity</h3>
<pre id="log"></pre>

<script>
const SERVICE =
'6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const DATA =
'6e400009-b5a3-f393-e0a9-e50e24dcca9e';

let device, server, data;

function log(s) {
 document.getElementById('log').textContent +=
 new Date().toLocaleTimeString() + ' ' + s + '\n';
}

function errorText(e) {
 try {
  return JSON.stringify({
   name:e?.name,
   message:e?.message,
   code:e?.code,
   string:String(e)
  });
 } catch {
  return String(e);
 }
}

async function connect() {
 try {
  device = await navigator.bluetooth.requestDevice({
   filters:[{name:'OBD2-CAN'}],
   optionalServices:[SERVICE]
  });

  server = await device.gatt.connect();
  const service =
   await server.getPrimaryService(SERVICE);

  data = await service.getCharacteristic(DATA);
  log('CONNECTED TO RED');
  inspect();
 } catch(e) {
  log('ERROR: ' + errorText(e));
 }
}

function inspect() {
 if(!data) {
  log('Connect first');
  return;
 }

 const p = data.properties;
 log('DATA UUID: ' + data.uuid);
 log('write: ' + p.write);
 log('writeWithoutResponse: ' +
     p.writeWithoutResponse);
 log('read: ' + p.read);
 log('notify: ' + p.notify);

 for(const method of [
  'writeValueWithResponse',
  'writeValue',
  'writeValueWithoutResponse'
 ]) {
  log(method + ': ' + typeof data[method]);
 }

 log('Inspection complete.');
 log('No binary data transmitted.');
}

function disconnect() {
 if(device?.gatt?.connected)
  device.gatt.disconnect();
 data = null;
 log('DISCONNECTED');
}
</script>
</body>
</html>
