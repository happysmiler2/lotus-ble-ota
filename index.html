
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Lotus BLE DATA Write Test</title>

<style>
body {
  background: #101820;
  color: #e9f0f7;
  font-family: -apple-system, Arial, sans-serif;
  padding: 18px;
}
h2 { color: #80c9ff; }
button {
  background: #244665;
  color: white;
  border: 1px solid #658aaa;
  border-radius: 8px;
  padding: 14px;
  margin: 5px 4px;
  font-size: 15px;
}
button:disabled { opacity: .4; }
pre {
  background: #070d13;
  padding: 14px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
}
</style>
</head>

<body>
<h2>Lotus BLE DATA Write Test</h2>

<p>
RED: Diagnostic_Tester_ESP32C3.ino<br>
Firmware: V1.56-ROAD<br>
Test: 4-byte DATA write, no OTA BEGIN
</p>

<button onclick="connectRED()">
  1. Connect RED
</button>

<button id="testBtn"
        onclick="testDATA()"
        disabled>
  2. Test DATA Write
</button>

<button onclick="disconnectRED()">
  Disconnect
</button>

<h3>Activity Log</h3>
<pre id="log">Ready.</pre>

<script>
const SERVICE =
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const CTRL =
  "6e400008-b5a3-f393-e0a9-e50e24dcca9e";

const DATA =
  "6e400009-b5a3-f393-e0a9-e50e24dcca9e";

const REPLY =
  "6e40000a-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let ctrl = null;
let data = null;
let reply = null;

function log(message) {
  const el = document.getElementById("log");
  el.textContent +=
    "\n" +
    new Date().toLocaleTimeString() +
    " " + message;
}

function describeError(e) {
  try {
    return JSON.stringify({
      name: e?.name,
      message: e?.message,
      code: e?.code,
      text: String(e)
    });
  } catch (_) {
    return String(e);
  }
}

async function connectRED() {
  try {
    log("Requesting OBD2-CAN...");

    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "OBD2-CAN" }],
      optionalServices: [SERVICE]
    });

    device.addEventListener(
      "gattserverdisconnected",
      () => {
        log("RED disconnected");
        document.getElementById("testBtn")
          .disabled = true;
      }
    );

    const server = await device.gatt.connect();
    const service =
      await server.getPrimaryService(SERVICE);

    ctrl = await service.getCharacteristic(CTRL);
    data = await service.getCharacteristic(DATA);
    reply = await service.getCharacteristic(REPLY);

    await reply.startNotifications();

    reply.addEventListener(
      "characteristicvaluechanged",
      event => {
        const value = event.target.value;
        const text = new TextDecoder().decode(value);
        log("RED: " + text);
      }
    );

    log("Connected to RED");
    log("DATA write property: " +
        data.properties.write);

    const info = new TextEncoder().encode("INFO");
    await ctrl.writeValueWithResponse(info);

    document.getElementById("testBtn")
      .disabled = false;

    log("Ready for DATA test.");

  } catch (e) {
    log("CONNECT ERROR: " + describeError(e));
  }
}

async function testDATA() {
  const button = document.getElementById("testBtn");
  button.disabled = true;

  try {
    if (!device?.gatt?.connected || !data) {
      throw new Error("RED is not connected");
    }

    // Firmware ignores DATA outside an OTA session.
    // Do NOT send BEGIN.
    const packet = new Uint8Array([
      0x11, 0x22, 0x33, 0x44
    ]);

    log("Sending DATA: 11 22 33 44");
    log("Method: writeValueWithResponse");

    await data.writeValueWithResponse(packet);

    log("PASS: DATA write resolved.");
    log("No OTA session started.");

  } catch (e) {
    log("FAIL: " + describeError(e));
  } finally {
    button.disabled = false;
  }
}

function disconnectRED() {
  if (device?.gatt?.connected) {
    device.gatt.disconnect();
  }
  document.getElementById("testBtn")
    .disabled = true;
  log("Disconnected.");
}
</script>
</body>
</html>
