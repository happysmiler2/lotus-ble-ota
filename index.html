
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus OTA Packet Size Test</title>
<style>
body {
  background:#101820;
  color:#e9f0f7;
  font:16px -apple-system,Arial,sans-serif;
  padding:18px;
}
h2 {color:#80c9ff}
button,select {
  background:#244665;
  color:white;
  border:1px solid #658aaa;
  border-radius:8px;
  padding:13px;
  margin:5px;
  font-size:16px;
}
button:disabled {opacity:.4}
pre {
  background:#070d13;
  padding:14px;
  border-radius:8px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}
progress {width:100%;height:22px}
</style>
</head>
<body>

<h2>Lotus OTA — Packet Size Test</h2>
<p>
RED: Diagnostic_Tester_ESP32C3.ino<br>
Firmware V1.56-ROAD<br>
BENCH ONLY — 16 KB transfer followed by ABORT.
</p>

<button onclick="connectRED()">1. Connect RED</button>

<p>2. Select application firmware:</p>
<input id="file" type="file" accept=".bin"
       onchange="ready()">

<p>3. BLE packet size:</p>
<select id="size">
<option value="20">20 bytes (baseline)</option>
<option value="64" selected>64 bytes</option>
<option value="128">128 bytes</option>
</select>

<p>
<label>
<input id="confirm" type="checkbox" onchange="ready()">
RED is on bench, GPIO1 grounded before boot,
BLUE simulates zero RPM and speed.
</label>
</p>

<button id="test" disabled onclick="runTest()">
4. Start 16 KB Test
</button>
<button onclick="abortOTA()">ABORT</button>

<h3>Transfer progress</h3>
<progress id="progress" value="0" max="16384"></progress>
<div id="counter">0 / 16384 bytes</div>

<h3>Activity Log</h3>
<pre id="log">Ready.</pre>

<script>
const SERVICE="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CTRL="6e400008-b5a3-f393-e0a9-e50e24dcca9e";
const DATA="6e400009-b5a3-f393-e0a9-e50e24dcca9e";
const REPLY="6e40000a-b5a3-f393-e0a9-e50e24dcca9e";

const enc=new TextEncoder();
const dec=new TextDecoder();
const TARGET=16384;

let device,ctrl,data,reply;
let busy=false,stop=false,uploadActive=false;
let received=[];

function log(s) {
  document.getElementById("log").textContent +=
    "\n"+new Date().toLocaleTimeString()+" "+s;
}

function error(e) {
  return JSON.stringify({
    name:e?.name,
    message:e?.message,
    code:e?.code,
    text:String(e)
  });
}

function ready() {
  document.getElementById("test").disabled =
    busy ||
    !device?.gatt?.connected ||
    !document.getElementById("file").files.length ||
    !document.getElementById("confirm").checked;
}

async function cmd(s) {
  log("CTRL > "+s);
  await ctrl.writeValueWithResponse(enc.encode(s));
}

async function connectRED() {
  try {
    device=await navigator.bluetooth.requestDevice({
      filters:[{name:"OBD2-CAN"}],
      optionalServices:[SERVICE]
    });

    device.addEventListener("gattserverdisconnected",()=>{
      log("RED disconnected");
      stop=true;
      ready();
    });

    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);

    ctrl=await service.getCharacteristic(CTRL);
    data=await service.getCharacteristic(DATA);
    reply=await service.getCharacteristic(REPLY);

    await reply.startNotifications();

    reply.addEventListener(
      "characteristicvaluechanged",e=>{
        const s=dec.decode(e.target.value);
        received.push(s);
        log("RED: "+s);
        if(s.startsWith("OTA,ERR"))stop=true;
      }
    );

    log("Connected");
    await cmd("INFO");
    ready();

  } catch(e) {
    log("CONNECT ERROR: "+error(e));
  }
}

async function waitFor(prefix,after,timeout=5000) {
  const until=Date.now()+timeout;
  while(Date.now()<until) {
    const hit=received.slice(after).find(
      s=>s.startsWith(prefix)||
         s.startsWith("OTA,ERR")
    );
    if(hit)return hit;
    await new Promise(r=>setTimeout(r,40));
  }
  throw new Error("Timeout waiting for "+prefix);
}

async function abortOTA() {
  stop=true;
  try {
    if(ctrl&&device?.gatt?.connected) {
      await cmd("ABORT");
      log("ABORT command sent");
    }
  } catch(e) {
    log("ABORT ERROR: "+error(e));
  }
}

async function runTest() {
  if(busy)return;
  busy=true;
  stop=false;
  ready();

  let sent=0;
  const started=Date.now();
  const packetSize=Number(
    document.getElementById("size").value
  );

  document.getElementById("progress").value=0;
  document.getElementById("counter").textContent=
    "0 / "+TARGET+" bytes";

  try {
    const file=document.getElementById("file").files[0];
    const bytes=new Uint8Array(await file.arrayBuffer());

    if(bytes.length<TARGET||bytes[0]!==0xe9)
      throw new Error("Invalid application binary");

    if(!data.properties.write)
      throw new Error("DATA does not support write");

    log("Testing "+packetSize+"-byte packets");
    log("Firmware: "+file.name+
        " ("+bytes.length+" bytes)");

    let index=received.length;
    await cmd("INFO");
    let s=await waitFor("OTA,ARMED",index);
    if(s!=="OTA,ARMED")
      throw new Error("Not armed: "+s);

    index=received.length;
    await cmd("BEGIN,"+bytes.length);
    s=await waitFor("OTA,READY",index);
    if(s!=="OTA,READY")
      throw new Error("BEGIN failed: "+s);

    uploadActive=true;
    const progressStart=received.length;

    while(sent<TARGET&&!stop) {
      const part=bytes.slice(
        sent,Math.min(sent+packetSize,TARGET)
      );

      await data.writeValueWithResponse(part);
      sent+=part.length;

      document.getElementById("progress").value=sent;
      document.getElementById("counter").textContent=
        sent+" / "+TARGET+" bytes";

      if(sent%2048<packetSize||sent===TARGET)
        log("BLE writes resolved: "+sent+"/"+TARGET);
    }

    if(stop) {
      log("Transfer stopped at "+sent+" bytes");
    } else {
      log("All 16 KB BLE writes resolved");
      await new Promise(r=>setTimeout(r,700));

      const progress=received.slice(progressStart)
        .filter(s=>s.startsWith("OTA,PROGRESS"))
        .slice(-1)[0];

      log(progress
        ? "ESP32 confirmation: "+progress
        : "No ESP32 progress notification received");
    }

  } catch(e) {
    log("TEST ERROR: "+error(e));
  } finally {
    const seconds=(Date.now()-started)/1000;
    log("Elapsed: "+seconds.toFixed(1)+" seconds");
    log("Bytes written through BLE: "+sent);

    await abortOTA();
    uploadActive=false;
    busy=false;
    ready();

    log("TEST FINISHED — END never sent");
  }
}
</script>
</body>
</html>
