
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus OTA 16 KB Test</title>
<style>
body {
  background:#101820;
  color:#e9f0f7;
  font:16px -apple-system,Arial,sans-serif;
  padding:18px;
}
button {
  background:#244665;
  color:white;
  border:1px solid #658aaa;
  border-radius:8px;
  padding:13px;
  margin:5px;
}
button:disabled {opacity:.4}
pre {
  background:#070d13;
  padding:14px;
  border-radius:8px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}
</style>
</head>
<body>

<h2>Lotus OTA — 16 KB Test</h2>
<p>
RED: Diagnostic_Tester_ESP32C3.ino · V1.56-ROAD<br>
BENCH ONLY. Sends 16,384 bytes then ABORT. Never END.
</p>

<button id="connect" onclick="connectRED()">
1. Connect RED
</button>

<p>
2. Select application .bin:
<input id="file" type="file" accept=".bin"
       onchange="ready()">
</p>

<p>
<label>
<input id="confirm" type="checkbox" onchange="ready()">
RED is on bench, GPIO1 grounded before boot;
BLUE simulates zero RPM and speed.
</label>
</p>

<button id="test" disabled onclick="runTest()">
3. Test 16 KB
</button>

<button id="abort" onclick="abortOTA()">ABORT</button>

<h3>Activity Log</h3>
<pre id="log">Ready.</pre>

<script>
const SERVICE =
'6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CTRL =
'6e400008-b5a3-f393-e0a9-e50e24dcca9e';
const DATA =
'6e400009-b5a3-f393-e0a9-e50e24dcca9e';
const REPLY =
'6e40000a-b5a3-f393-e0a9-e50e24dcca9e';

const enc = new TextEncoder();
const dec = new TextDecoder();

let device, ctrl, data, reply;
let busy = false;
let stop = false;
const received = [];

function log(s) {
  document.getElementById('log').textContent +=
    '\n' + new Date().toLocaleTimeString() + ' ' + s;
}

function error(e) {
  return JSON.stringify({
    name:e?.name,
    message:e?.message,
    code:e?.code,
    text:String(e)
  });
}

function ready() {
  document.getElementById('test').disabled =
    busy ||
    !device?.gatt?.connected ||
    !document.getElementById('file').files.length ||
    !document.getElementById('confirm').checked;
}

async function cmd(s) {
  log('CTRL > ' + s);
  await ctrl.writeValueWithResponse(enc.encode(s));
}

async function connectRED() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters:[{name:'OBD2-CAN'}],
      optionalServices:[SERVICE]
    });

    device.addEventListener(
      'gattserverdisconnected',
      () => {
        log('RED disconnected');
        stop = true;
        ready();
      }
    );

    const server = await device.gatt.connect();
    const service =
      await server.getPrimaryService(SERVICE);

    ctrl = await service.getCharacteristic(CTRL);
    data = await service.getCharacteristic(DATA);
    reply = await service.getCharacteristic(REPLY);

    await reply.startNotifications();

    reply.addEventListener(
      'characteristicvaluechanged',
      e => {
        const s = dec.decode(e.target.value);
        received.push(s);
        log('RED: ' + s);
      }
    );

    log('Connected');
    await cmd('INFO');
    ready();

  } catch(e) {
    log('CONNECT ERROR: ' + error(e));
  }
}

async function waitFor(prefix, after, timeout=5000) {
  const until = Date.now() + timeout;

  while(Date.now() < until) {
    const hit = received.slice(after).find(
      s => s.startsWith(prefix) ||
           s.startsWith('OTA,ERR')
    );

    if(hit) return hit;

    await new Promise(r => setTimeout(r,40));
  }

  throw new Error('Timeout waiting for ' + prefix);
}

async function abortOTA() {
  stop = true;

  try {
    if(ctrl && device?.gatt?.connected) {
      await cmd('ABORT');
      log('ABORT command sent');
    }
  } catch(e) {
    log('ABORT ERROR: ' + error(e));
  }
}

async function runTest() {
  if(busy) return;

  busy = true;
  stop = false;
  ready();

  let began = false;

  try {
    const f = document.getElementById('file').files[0];
    const bytes = new Uint8Array(await f.arrayBuffer());

    if(bytes.length < 16384 || bytes[0] !== 0xe9)
      throw new Error(
        'Select valid ESP32 application .bin >= 16 KB'
      );

    if(!data.properties.write)
      throw new Error(
        'DATA write property not available'
      );

    log('File: ' + f.name +
        ' (' + bytes.length + ' bytes)');

    let index = received.length;
    await cmd('INFO');

    let s = await waitFor('OTA,ARMED', index);

    if(s !== 'OTA,ARMED')
      throw new Error('Not armed: ' + s);

    index = received.length;
    await cmd('BEGIN,' + bytes.length);

    s = await waitFor('OTA,READY', index);

    if(s !== 'OTA,READY')
      throw new Error('BEGIN failed: ' + s);

    began = true;

    const target = 16384;
    const chunkSize = 20;
    let sent = 0;

    while(sent < target && !stop) {
      const part = bytes.slice(
        sent,
        Math.min(sent + chunkSize, target)
      );

      await data.writeValueWithResponse(part);
      sent += part.length;

      if(sent % 2048 === 0 || sent === target)
        log(
          'BLE writes resolved: ' +
          sent + '/' + target + ' bytes'
        );
    }

    if(stop) {
      log(
        'Stopped by user or disconnect at ' +
        sent + ' bytes'
      );
    } else {
      log(
        '16 KB BLE writes completed. ' +
        'Waiting briefly for RED progress notification...'
      );

      await new Promise(
        r => setTimeout(r,600)
      );

      const progress = received.findLast
        ? received.findLast(
            x => x.startsWith('OTA,PROGRESS')
          )
        : received.filter(
            x => x.startsWith('OTA,PROGRESS')
          ).slice(-1)[0];

      log(
        progress
          ? 'Last progress: ' + progress
          : 'No OTA,PROGRESS observed — check RED USB serial output'
      );
    }

  } catch(e) {
    log('TEST ERROR: ' + error(e));
  } finally {
    if(began)
      log('Aborting incomplete transfer');

    await abortOTA();

    busy = false;
    ready();

    log('TEST FINISHED — END was not sent');
  }
}
</script>
</body>
</html>
