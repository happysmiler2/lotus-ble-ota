
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus OTA First Packet Test</title>
<style>
body{background:#101820;color:#e9f0f7;
font:16px -apple-system,Arial,sans-serif;padding:18px}
button{background:#244665;color:white;border:1px solid #658aaa;
border-radius:8px;padding:14px;margin:5px}
button:disabled{opacity:.4}
pre{background:#070d13;padding:14px;border-radius:8px;
white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
</style>
</head>
<body>
<h2>Lotus OTA — First Packet Test</h2>
<p>RED: Diagnostic_Tester_ESP32C3.ino<br>
V1.56-ROAD · BENCH ONLY</p>
<p>Sends only 20 firmware bytes, then ABORT.
Never sends END.</p>

<button id="connect" onclick="connectRED()">1. Connect RED</button>
<p><input id="file" type="file" accept=".bin"
onchange="checkReady()"> 2. Select application .bin</p>
<label><input type="checkbox" id="confirm"
onchange="checkReady()">
RED is on the bench, engine off, GPIO1 grounded,
BLUE simulating zero speed/RPM.</label>
<p><button id="test" disabled onclick="runTest()">
3. Test First Packet
</button></p>
<button onclick="abortOTA()">ABORT OTA</button>
<h3>Activity Log</h3>
<pre id="log">Ready.</pre>

<script>
const SERVICE="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CTRL="6e400008-b5a3-f393-e0a9-e50e24dcca9e";
const DATA="6e400009-b5a3-f393-e0a9-e50e24dcca9e";
const REPLY="6e40000a-b5a3-f393-e0a9-e50e24dcca9e";

let device,ctrl,data,reply;
let status="",busy=false;
const enc=new TextEncoder();
const dec=new TextDecoder();

function log(s){
document.getElementById("log").textContent +=
"\n"+new Date().toLocaleTimeString()+" "+s;
}
function err(e){
return JSON.stringify({
name:e?.name,message:e?.message,
code:e?.code,text:String(e)
});
}
function checkReady(){
document.getElementById("test").disabled=
busy || !device?.gatt?.connected ||
!document.getElementById("file").files.length ||
!document.getElementById("confirm").checked;
}
async function command(s){
log("CTRL > "+s);
await ctrl.writeValueWithResponse(enc.encode(s));
}
async function connectRED(){
try{
device=await navigator.bluetooth.requestDevice({
filters:[{name:"OBD2-CAN"}],
optionalServices:[SERVICE]
});
device.addEventListener("gattserverdisconnected",()=>{
log("Disconnected");checkReady();
});
const server=await device.gatt.connect();
const service=await server.getPrimaryService(SERVICE);
ctrl=await service.getCharacteristic(CTRL);
data=await service.getCharacteristic(DATA);
reply=await service.getCharacteristic(REPLY);
await reply.startNotifications();
reply.addEventListener("characteristicvaluechanged",e=>{
status=dec.decode(e.target.value);
log("RED: "+status);
});
log("Connected");
await command("INFO");
checkReady();
}catch(e){log("CONNECT ERROR: "+err(e));}
}
function waitForStatus(prefix,timeout=4000){
return new Promise((resolve,reject)=>{
if(status.startsWith(prefix))return resolve(status);
let finished=false;
const listener=e=>{
const s=dec.decode(e.target.value);
if(s.startsWith(prefix)||s.startsWith("OTA,ERR")){
finished=true;
reply.removeEventListener("characteristicvaluechanged",listener);
resolve(s);
}
};
reply.addEventListener("characteristicvaluechanged",listener);
setTimeout(()=>{
if(!finished){
reply.removeEventListener("characteristicvaluechanged",listener);
reject(new Error("Timeout waiting for "+prefix));
}
},timeout);
});
}
async function abortOTA(){
try{
if(ctrl && device?.gatt?.connected){
await command("ABORT");
log("ABORT command sent");
}
}catch(e){log("ABORT ERROR: "+err(e));}
}
async function runTest(){
if(busy)return;
busy=true;checkReady();
let began=false;
try{
const file=document.getElementById("file").files[0];
const bytes=new Uint8Array(await file.arrayBuffer());
if(bytes.length<4096||bytes[0]!==0xE9)
throw new Error("Invalid ESP32 application binary");
if(!data.properties.write)
throw new Error("DATA lacks write-with-response property");
log("File: "+file.name+" ("+bytes.length+" bytes)");
status="";
await command("INFO");
const armed=await waitForStatus("OTA,ARMED");
if(armed!=="OTA,ARMED")
throw new Error("RED not armed: "+armed);

status="";
await command("BEGIN,"+bytes.length);
const ready=await waitForStatus("OTA,READY");
if(ready!=="OTA,READY")
throw new Error("BEGIN rejected: "+ready);
began=true;

const first=bytes.slice(0,20);
log("Sending first 20 bytes: "+
Array.from(first).map(x=>x.toString(16).padStart(2,"0")).join(" "));
await data.writeValueWithResponse(first);
log("PASS: First DATA packet write resolved");
log("This does not yet confirm flash success");
}catch(e){
log("TEST ERROR: "+err(e));
}finally{
if(began)log("Stopping after first packet");
await abortOTA();
busy=false;checkReady();
log("TEST FINISHED — no END sent");
}
}
</script>
</body>
</html>
